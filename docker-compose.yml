version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: recruitment_mysql
    environment:
      MYSQL_DATABASE: recruitment
      MYSQL_ROOT_PASSWORD: 123456
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: recruitment_redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: recruitment_rabbitmq
    ports:
      - "5672:5672"     # AMQP port
      - "15672:15672"   # HTTP Management UI
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  backend:
    build: .
    container_name: recruitment_backend
    ports:
      - "8080:8080"
    depends_on:
      - mysqldb
      - redis
    env_file:
      - .env

volumes:
  mysql_data:
  rabbitmq_data:
