spring:
  application:
    name: recruitment
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
      dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true

  # config pagination start 1
  data:
    web:
      pageable:
        one-indexed-parameters: true
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:false}
  # Multipart config
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  # Mail config
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  # RabbitMQ config
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:${RABBITMQ_HOST:localhost}}
    port: ${SPRING_RABBITMQ_PORT:${RABBITMQ_PORT:5672}}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    ssl:
      enabled: ${SPRING_RABBITMQ_SSL_ENABLED:false}
    listener:
      simple:
        acknowledge-mode: manual    # Manual ACK
        prefetch: 10                # Mỗi consumer giữ tối đa 10 message

  # Gemini Config (Official Google GenAI)
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: ${GEMINI_MODEL}
            temperature: 0.0
        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            options:
              model: gemini-embedding-001

# Feature flag để switch giữa legacy và RabbitMQ
notification:
  publisher: rabbitmq   # Đổi thành "spring-events" để dùng legacy path

#config jwt
caochung:
  jwt:
    base64-secret: ${JWT_SECRET}
    # expiration 1h
    access-token-validity-in-second: 3600
    # expiration 7day
    refresh-token-validity-in-second: 604800

#cloudinary config
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

server:
  tomcat:
    max-swallow-size: -1